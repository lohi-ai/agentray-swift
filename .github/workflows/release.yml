name: release
on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing bare stable semver tag to resume
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: swift-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      release: ${{ steps.plan.outputs.release }}
      createTag: ${{ steps.plan.outputs.createTag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Preserve workflow policy for legacy tag retries
        run: |
          cp .github/release-plan.mjs "$RUNNER_TEMP/release-plan.mjs"
          cp .github/release-plan.test.mjs "$RUNNER_TEMP/release-plan.test.mjs"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "$RUNNER_TEMP/release-plan.test.mjs"
      - id: plan
        run: node "$RUNNER_TEMP/release-plan.mjs"
        env:
          RELEASE_REF_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'tag' || github.ref_type }}
          RELEASE_REF_NAME: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
  tag:
    needs: [plan, verify]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
      - if: needs.plan.outputs.createTag == 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "AgentRay Swift $TAG"
          git push origin "$TAG"
  release:
    needs: [plan, tag]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: a consumer can resolve this tag by URL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer/Sources/App" && cd "$RUNNER_TEMP/consumer"
          cat > Package.swift <<SPM
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "App", platforms: [.macOS(.v11)],
              dependencies: [.package(url: "${{ github.server_url }}/${{ github.repository }}.git", exact: "$TAG")],
              targets: [.executableTarget(name: "App", dependencies: [.product(name: "AgentRay", package: "agentray-swift")])]
          )
          SPM
          printf 'import AgentRay\nAgentRay.start(host: "https://a.test", apiKey: "k")\nprint("resolved \\(String(describing: AgentRay.self))")\n' > Sources/App/main.swift
          swift run

      - name: Publish documentation and source downloads
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="agentray-swift-${TAG}.tar.gz" HEAD
          # Markdown code spans are literal in this printf format.
          # shellcheck disable=SC2016
          printf '# AgentRay Swift %s\n\nInstall with SwiftPM:\n\n`.package(url: "%s/%s.git", exact: "%s")`\n\nThe source archive includes README and Package.swift.\n' "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" > DOWNLOADS.md
          shasum -a 256 agentray-swift-*.tar.gz DOWNLOADS.md > checksums.txt
          if gh release view "$TAG" --json isDraft > state.json 2> release-error.txt; then
            test "$(python3 -c 'import json; print(json.load(open("state.json"))["isDraft"])')" = True
          elif grep -q 'release not found' release-error.txt; then
            case "$TAG" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "$TAG" --verify-tag --draft --title "AgentRay Swift $TAG" $prerelease
          else
            cat release-error.txt >&2
            exit 1
          fi
          gh release edit "$TAG" --notes-file DOWNLOADS.md
          gh release upload "$TAG" agentray-swift-*.tar.gz DOWNLOADS.md checksums.txt --clobber
          case "$TAG" in *-*) gh release edit "$TAG" --draft=false ;; *) gh release edit "$TAG" --draft=false --latest ;; esac
